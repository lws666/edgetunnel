name: Deploy edgetunnel to Cloudflare Workers

# Auto-deploy the upstream _worker.js to Workers.
#
# IMPORTANT: deploy via the Cloudflare API with a raw multipart upload, NOT
# wrangler. wrangler bundles the source (esbuild) which changes the code
# fingerprint, and edgetunnel's detection-sensitive payload then fails at
# runtime (Error 1101 / 522). The dashboard "paste source" path and this API
# path both upload plaintext, which is what works.
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - '.github/workflows/deploy-edgetunnel.yml'
  schedule:
    - cron: '30 1 * * *'   # daily 01:30 UTC, after the upstream sync at 00:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edgetunnel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream version
        id: ver
        run: |
          VER=$(grep -oE "const Version = '[^']*'" _worker.js | head -1 | sed "s/const Version = '//;s/'//")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "upstream version: $VER"
          echo "bytes: $(wc -c < _worker.js)"

      - name: Deploy plaintext via Cloudflare API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_ADMIN_PASSWORD: ${{ secrets.CF_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          META=$(jq -n \
            --arg main "worker.js" \
            --arg cdate "2025-11-04" \
            --arg kv "$CF_KV_NAMESPACE_ID" \
            --arg admin "$CF_ADMIN_PASSWORD" \
            '{main_module:$main, compatibility_date:$cdate,
              bindings:[
                {type:"kv_namespace", name:"KV", namespace_id:$kv},
                {type:"plain_text", name:"ADMIN", text:$admin}
              ]}')

          echo "uploading $(wc -c < _worker.js) bytes as plaintext module..."
          HTTP=$(curl -sS -o resp.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "worker.js=@_worker.js;type=application/javascript+module;filename=worker.js" \
            -F "metadata=${META};type=application/json")

          echo "HTTP ${HTTP}"
          jq -r '.success, (.errors[]?.message // empty)' resp.json || cat resp.json
          if [ "$HTTP" != "200" ] || [ "$(jq -r .success resp.json)" != "true" ]; then
            echo "::error::Cloudflare API rejected the upload"
            exit 1
          fi
          jq -r '"deployed entry_point=\(.result.entry_point) modified=\(.result.modified_on)"' resp.json

      - name: Verify deployment is live
        env:
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: |
          # A working edgetunnel answers /admin with a 302 to the login page.
          # 522/1101 means the script failed to run at the edge.
          URL="https://edge.zqnb.de5.net/admin"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "attempt $i: HTTP $CODE"
            case "$CODE" in
              200|302) echo "::notice::deployment healthy"; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::deployment did not become healthy (last HTTP $CODE)"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### edgetunnel deploy"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| upstream version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| worker | \`${{ secrets.CF_WORKER_NAME }}\` |"
            echo "| url | https://edge.zqnb.de5.net/admin |"
          } >> "$GITHUB_STEP_SUMMARY"
