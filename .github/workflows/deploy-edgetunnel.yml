name: Deploy edgetunnel to Cloudflare Workers

# Upstream sync (official sync.yml) updates the code in this fork daily.
# This workflow turns that code into an actual Worker deployment, keeping
# KV bindings and plain-text vars intact (wrangler `keep_vars` + explicit config).
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - '.github/workflows/deploy-edgetunnel.yml'
  schedule:
    - cron: '30 1 * * *'   # daily at 01:30 UTC, after upstream sync (00:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edgetunnel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read upstream version
        id: ver
        run: |
          VER=$(grep -oE "const Version = '[^']*'" _worker.js | head -1 | sed "s/const Version = '//;s/'//")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $VER"
          gzip -c _worker.js | wc -c | awk '{printf "gzip size: %.2f MB\n", $1/1048576}'

      - name: Write wrangler config
        run: |
          cat > wrangler.toml <<'TOML'
          name = "${{ secrets.CF_WORKER_NAME }}"
          main = "_worker.js"
          compatibility_date = "2025-11-04"
          keep_vars = true

          [[kv_namespaces]]
          binding = "KV"
          id = "${{ secrets.CF_KV_NAMESPACE_ID }}"
          TOML
          cat wrangler.toml

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@latest deploy 2>&1 | tee deploy.log
          if ! grep -q "Deployed .* triggers" deploy.log; then
            echo "::error::wrangler deploy did not report a successful deployment"
            exit 1
          fi

      - name: Smoke test
        run: |
          URL="https://${{ secrets.CF_WORKER_NAME }}.${{ secrets.CF_ACCOUNT_ID }}.workers.dev"
          # workers.dev subdomain is the account name, not the id; probe the custom domain instead
          TARGET="https://www.zqnb.de5.net/"
          echo "probing $TARGET"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET" || echo 000)
          echo "status: $CODE"
          if [ "$CODE" = "000" ]; then
            echo "::warning::smoke test could not reach the worker (network restriction on runner)"
          fi

      - name: Summary
        run: |
          {
            echo "### edgetunnel deployed"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| worker | \`${{ secrets.CF_WORKER_NAME }}\` |"
            echo "| domain | https://www.zqnb.de5.net/ |"
          } >> "$GITHUB_STEP_SUMMARY"
